[package]
name = "mcp-game-deck-app"
version = "2.0.0"
description = "MCP Game Deck — Tauri-based external chat host that drives Claude Code against the Unity Editor MCP server"
authors = ["RamonBedin"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "image-ico"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["process", "sync", "io-util", "time", "rt", "net", "macros"] }
notify = "6"
notify-debouncer-mini = "0.4"
walkdir = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[target."cfg(any(target_os = \"windows\", target_os = \"macos\", target_os = \"linux\"))".dependencies]
tauri-plugin-cli = "2.0.0"
